# ============================================================
#  Deal Radar — конфигурация
#  Меняй что угодно и перезапускай:  dealradar restart
# ============================================================

general:
  # Часовой пояс для расписаний и текстов уведомлений
  timezone: "Europe/Moscow"
  currency: "rub"
  # Как часто полный обход всех направлений (минуты)
  scan_interval_minutes: 45
  # Не слать одно и то же чаще, чем раз в N часов
  dedupe_hours: 72
  # Максимум уведомлений в сутки (чтобы не спамило)
  max_alerts_per_day: 12
  # Тихие часы (МСК) — в это время копим, но не шлём
  quiet_hours: [0, 8]

flights:
  enabled: true
  origins: ["MOW"]              # Москва (все аэропорты)
  # Насколько дешевле «нормальной» цены, чтобы считать это находкой.
  # 0.60 = скидка от 60 % и выше. Смягчить или ужесточить: /threshold 65
  min_discount: 0.60
  # Скидка, при которой находка считается выдающейся: для неё потолок цены
  # ниже расширяется в cap_stretch раз. Иначе Буэнос-Айрес за 62 000 вместо
  # обычных 160 000 не прошёл бы только потому, что абсолютная цифра большая.
  exceptional_discount: 0.72
  cap_stretch: 1.6
  # Отдельный поиск по бизнес-классу. Выключен не по желанию, а по факту:
  # API отвечает «Only economy trip class is supported», а на v3-ручке параметр
  # молча игнорируется и возвращает те же эконом-тарифы. Включать бессмысленно —
  # получишь эконом с подписью «бизнес». Если в выдаче всё же попадётся тариф
  # с признаком бизнес-класса, он будет помечен в карточке автоматически.
  scan_business: false
  # Твёрдый потолок на билет, руб. Выше — не присылаю никогда, каким бы
  # выгодным вариант ни был. null = без ограничения. Меняется командой /maxprice
  max_ticket_price: null
  # Санитарные потолки по дальности, руб. Это не главный фильтр (главный —
  # процент скидки), а страховка от кривой базовой цены. Поэтому они выставлены
  # с запасом: слишком низкие значения молча съедали бы настоящие находки
  # (Гоа за 29 000 при обычных 60 000 — это находка, а не «дорого»).
  hard_caps:
    short: 20000                # < 2500 км  (Турция, Кавказ, СНГ, Балканы)
    medium: 32000               # 2500–5500 км (ОАЭ, Египет, Индия, Марокко)
    long: 48000                 # 5500–9000 км (ЮВА, Африка, Китай)
    ultra: 75000                # > 9000 км (Лат. Америка, Океания)
  # Присылать только те направления, которые я умею планировать целиком
  # (есть в data/cities.json: виза, районы, трансфер, бюджет, план по дням).
  # false — присылать любые дешёвые находки, но без маршрута. По умолчанию
  # true: обещание «готовый маршрут» важнее количества уведомлений.
  only_known_destinations: true
  # Горизонт поиска
  search_days_ahead: 240
  # Минимум дней до вылета (чтобы успеть визу/отпуск)
  min_days_ahead: 10

trains:
  enabled: true
  # У РЖД цены регулируемые, скидок в 70 % там не бывает физически.
  # 0.50 — это уже сильная динамическая распродажа.
  min_discount: 0.50
  hard_caps:
    short: 1200                 # < 700 км
    medium: 2800                # 700–2000 км
    long: 5500                  # > 2000 км
  search_days_ahead: 90
  min_days_ahead: 2
  # Купе/СВ тоже мониторим, но интересна аномалия, а не абсолют
  classes: ["Плац", "Купе", "СВ", "Сид"]

# ------------------------------------------------------------
# Потолок бюджета ВСЕЙ поездки, руб: билеты + жильё + еда + виза +
# транспорт + страховка + запас. Не цена билета, а полная сумма.
# Дороже — не присылаю вообще. Менять из чата: /cap vacation 120000
# ------------------------------------------------------------
budget_caps:
  weekend: 50000            # трип выходного дня
  vacation: 100000          # полноценный отпуск
  long_trip: 150000         # длинная поездка 8–25 ночей
  multi_city: 200000        # сложный маршрут — считается отдельно
  long_stay: null           # длительное проживание: потолка нет

# ------------------------------------------------------------
# Форматы поездок. Уведомление придёт, только если даты билета
# укладываются в один из включённых сценариев.
# ------------------------------------------------------------
trip_shapes:
  weekend:
    enabled: true
    label: "Трип выходного дня"
    min_nights: 3
    max_nights: 4
    # Вылет туда: четверг после работы или пятница утром
    depart_weekdays: [3, 4]     # 0=пн … 6=вс
    depart_after_hour: 16       # для четверга — вечерний рейс
    depart_friday_before_hour: 11
    return_weekdays: [6, 0]     # вечер вс или ночь на пн
    return_after_hour: 15
    vacation_days_used: 1       # берём пятницу

  vacation:
    enabled: true
    label: "Стандартный отпуск"
    min_nights: 5
    max_nights: 9
    vacation_days_used: 5

  long_stay:
    enabled: true
    label: "Длительное проживание"
    min_nights: 25
    max_nights: 180
    # Для таких — только страны, где можно легально жить долго
    require_long_stay_legal: true

  multi_city:
    enabled: true
    label: "Сложный маршрут"
    min_nights: 8
    max_nights: 25
    max_legs: 3
    # Минимум ночей в каждой стране, иначе это не отдых, а гонка
    min_nights_per_stop: 3

# ------------------------------------------------------------
# Личные ограничения — влияют на планирование
# ------------------------------------------------------------
traveller:
  citizenship: "RU"
  passport_valid_until: null    # "2030-05-01" — тогда бот предупредит про правило 6 месяцев
  has_schengen_visa: false
  has_us_visa: false
  has_uk_visa: false
  # Максимум отпускных дней, которые готова потратить за раз
  max_vacation_days: 10
  # Максимум пересадок в одну сторону. 0 = только прямые рейсы.
  max_stops: 1
  # Максимальная длительность в одну сторону, часов
  max_leg_hours: 20
  # Комфортный бюджет на жильё, руб/ночь
  nightly_budget: 4500

# ------------------------------------------------------------
# Что считать удобным рейсом
# ------------------------------------------------------------
comfort:
  # Вылет не раньше и не позже — рейсы вне окна отбрасываются.
  # Ночные вылеты (02:00–06:00) не проходят: выспаться не получится.
  depart_hour_from: 6
  depart_hour_to: 23
  # Прямые рейсы всегда в приоритете. Если пересадка есть, она должна быть
  # либо короткой и удобной, либо длинной настолько, чтобы выйти в город.
  # Промежуточные 4–7 часов — худший вариант: и не погуляешь, и высидишь.
  layover_short_max_hours: 4
  layover_city_walk_min_hours: 8
  # Отсекать авиакомпании, которые массово летают на Superjet
  avoid_ssj: true
  # Ручная кладь обязательна всегда
  require_cabin_bag: true
  # А для этих форматов обязателен ещё и полноценный багаж: на месяцы
  # уезжать с одной ручной кладью бессмысленно
  require_checked_bag_for: ["long_stay", "long_trip", "multi_city"]
  # Не присылать направления в неподходящий сезон (Дубай в июле и т.п.)
  season_filter: true
  # Исключение: при скидке выше этой планки присылать даже вне сезона
  season_override_discount: 0.85

# ------------------------------------------------------------
# Направления. Пустой список = «все, что вернёт API».
# Здесь — только исключения.
# ------------------------------------------------------------
destinations:
  # Никогда не предлагать
  blacklist_countries: ["UA", "SY", "AF", "YE", "SD", "LY", "SO", "HT", "ML"]
  blacklist_cities: []
  # Приоритет: понизить порог скидки на 7 п.п. для этих стран
  wishlist_countries: []

telegram:
  # Заполняется через setup.py, руками трогать не надо
  enabled: true
  parse_mode: "HTML"
  disable_web_page_preview: false
